<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Календарчилсан төлөвлөгөө</title>
<style>
:root{--ink:#1e293b;--muted:#64748b;--border:#e2e8f0;--bg:#f1f5f9;--card:#fff;--blue:#2563eb;--green:#16a34a;--red:#dc2626;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{background:#1e3a5f;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.top-left h1{font-size:15px;font-weight:700;margin-bottom:1px;}
.top-left .sub{font-size:11px;color:rgba(255,255,255,.38);}
.kpis{display:flex;gap:20px;}
.kpi .kn{font-size:20px;font-weight:800;line-height:1;}
.kn.ac{color:#60a5fa;}.kn.gn{color:#4ade80;}.kn.rd{color:#f87171;}
.kpi .kl{font-size:9px;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.06em;}
.toolbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.toolbar select,.toolbar input{padding:5px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;font-family:inherit;color:var(--ink);background:#fff;cursor:pointer;}
.toolbar input{width:150px;}
.tl{font-size:11px;color:var(--muted);font-weight:600;}
.sep{width:1px;height:20px;background:var(--border);margin:0 2px;}
.month-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
.mnav-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.mnav-btn:hover{background:#f1f5f9;}
.month-label{font-size:14px;font-weight:700;color:var(--ink);min-width:110px;text-align:center;}
.today-btn{padding:5px 14px;border:1px solid var(--blue);border-radius:7px;background:#fff;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.today-btn:hover{background:#eff6ff;}
.legend{display:flex;gap:10px;}
.lg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);}
.lg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.month-stats-bar{background:#fff;border-bottom:1px solid var(--border);padding:5px 20px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ms-label{font-size:13px;font-weight:700;color:var(--ink);margin-right:4px;}
.badge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;}
.bd{background:#dcfce7;color:#15803d;}.bo{background:#fee2e2;color:#b91c1c;}
.bt{background:#f1f5f9;color:#64748b;}.bp{background:#dbeafe;color:#1d4ed8;}
.bu{background:#fef3c7;color:#92400e;}
.main{display:flex;flex:1;overflow:hidden;}
.cal-area{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:10px 14px;}
.cal-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.cal-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.cal-table thead th{background:#f8fafc;font-size:11px;font-weight:700;color:var(--muted);padding:7px 4px;text-align:center;border:1px solid var(--border);letter-spacing:.04em;}
.day{vertical-align:top;padding:4px 5px;border:1px solid var(--border);background:#fff;height:var(--day-h,100px);overflow-y:auto;}
.day:hover{background:#fafbff;}
.empty-cell{background:#f8fafc;border:1px solid var(--border);}
.today-cell{background:#eff6ff;border:1px solid #bfdbfe!important;}
.day-num{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:3px;display:inline-block;padding:1px 2px;}
.today-num{background:var(--blue);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.evt{font-size:10.5px;font-weight:500;padding:2px 5px;border-radius:3px;margin-bottom:2px;cursor:pointer;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:filter .1s;}
.evt:hover{filter:brightness(.93);}
.detail-panel{width:300px;flex-shrink:0;background:#fff;border-left:1px solid var(--border);display:none;flex-direction:column;overflow:hidden;}
.detail-panel.open{display:flex;}
.dp-head{padding:13px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px;}
.dp-title{font-size:13px;font-weight:700;color:var(--ink);line-height:1.45;flex:1;}
.dp-close{font-size:20px;color:var(--muted);cursor:pointer;flex-shrink:0;line-height:1;}
.dp-close:hover{color:var(--ink);}
.dp-src{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:4px;display:inline-block;}
.dp-body{padding:13px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:11px;}
.dp-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px;}
.dp-val{font-size:12px;color:var(--ink);}
.dp-owner-row{display:flex;align-items:center;gap:8px;}
.dp-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;}
.dp-stat{display:inline-flex;align-items:center;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;}
.dp-track{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:4px;}
.dp-fill{height:100%;border-radius:3px;}
.dp-note{font-size:11.5px;color:#475569;line-height:1.6;background:#f8fafc;border-radius:6px;padding:9px 11px;border:1px solid var(--border);}
</style>
</head>

</div>
<div class="month-stats-bar">

  <span class="badge bd" id="ms-done">—</span>
  <span class="badge bo" id="ms-over" style="display:none">—</span>
  <span class="badge bp" id="ms-pend">—</span>
  <span class="badge bu" id="ms-urg">—</span>
  <span class="badge bt" id="ms-total">—</span>
</div>
<div class="main">
  <div class="cal-area">
    <div class="cal-wrap">
      <table class="cal-table" id="cal-table">
        <thead><tr>
          <th>Даваа</th><th>Мягмар</th><th>Лхагва</th><th>Пүрэв</th><th>Баасан</th><th>Бямба</th><th>Ням</th>

      </table>
    </div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="dp-head">
      <div>
        <div class="dp-title" id="dp-title">—</div>
        <div id="dp-src-badge"></div>
      </div>

    <div class="dp-body" id="dp-body"></div>
  </div>
</div>

const MN = ['','1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар','7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];
const MONTHS_LIST = ["2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09", "2026-10", "2026-11", "2026-12"];
let currentYM='2026-08';

function renderMonth(ym) {
  if (!MONTHS_HTML[ym]) return;
  currentYM = ym;
  const [y,m] = ym.split('-').map(Number);
  document.getElementById('month-label').textContent = y + ' · ' + MN[m];
  document.getElementById('cal-body').innerHTML = MONTHS_HTML[ym];
  document.getElementById('month-select').value = ym;
  applyFilters(false);
  updateStats(ym);
  closeDetail();
  setTimeout(calcDayHeight, 10);
}

function updateStats(ym) {
  const [y,m] = ym.split('-').map(Number);
  const mt = TASKS.filter(t => {
    if (!t.due) return false;
    const d = t.due.split('.');
    return parseInt(d[0])===y && parseInt(d[1])===m;
  });
  const done = mt.filter(t=>t.done).length;
  const over = mt.filter(t=>t.ov).length;
  const pend = mt.filter(t=>!t.done&&!t.ov).length;
  const urg  = mt.filter(t=>t.src==='Яаралтай').length;
  document.getElementById('ms-label').textContent = y+' · '+MN[m];
  document.getElementById('ms-done').textContent  = done+' дууссан';
  const oe = document.getElementById('ms-over');
  if(over>0){oe.textContent=over+' хоцорсон';oe.style.display='';}else oe.style.display='none';
  document.getElementById('ms-pend').textContent  = pend+' явагдаж байна';
  document.getElementById('ms-urg').textContent   = urg+' яаралтай';
  document.getElementById('ms-total').textContent = mt.length+' нийт';
}

  const idx = MONTHS_LIST.indexOf(currentYM);
  const n = idx+dir;
  if(n>=0&&n<MONTHS_LIST.length) renderMonth(MONTHS_LIST[n]);
}
function goToMonth(ym){ renderMonth(ym); }
function goToToday(){ renderMonth('2026-08'); }

function applyFilters() {
  const owner  = document.getElementById('f-owner').value;
  const cat    = document.getElementById('f-cat').value;
  const stat   = document.getElementById('f-stat').value;
  const src    = document.getElementById('f-src').value;
  const search = document.getElementById('f-search').value.toLowerCase();
  document.querySelectorAll('.evt').forEach(ev => {
    const id = ev.dataset.id;
    const t  = TASK_MAP[id];
    if(!t) return;
    let show = true;
    if(owner  && t.owner!==owner) show=false;
    if(cat    && t.cat!==cat)     show=false;
    if(stat==='done' && !t.done)  show=false;
    if(stat==='over' && !t.ov)    show=false;
    if(stat==='pend' && (t.done||t.ov)) show=false;
    if(src    && t.src!==src)     show=false;
    if(search && !t.name.toLowerCase().includes(search)) show=false;
    ev.style.display = show?'':'none';
  });
}

function showDetail(id) {
  const t = TASK_MAP[id];
  if(!t) return;
  document.getElementById('dp-title').textContent = t.name;
  const isUrg = t.src==='Яаралтай';
  document.getElementById('dp-src-badge').innerHTML = isUrg
    ? '<span class="dp-src" style="background:#fef3c7;color:#92400e">⚡ Яаралтай чиглэл</span>'
    : '<span class="dp-src" style="background:#dbeafe;color:#1d4ed8">📋 Ажлын сан</span>';
  const statTxt  = t.done?'Дууссан':t.ov?'Хоцорсон':(t.stat||'Явагдаж байна');
  const statColor= t.done?'#15803d':t.ov?'#b91c1c':'#1d4ed8';
  const statBg   = t.done?'#dcfce7':t.ov?'#fee2e2':'#dbeafe';
  const progCol  = t.done?'#16a34a':t.ov?'#dc2626':'#2563eb';
  const oc       = ADV_COLORS[t.owner]||'#64748b';
  const ini      = (t.owner||'').split(' ').map(w=>w[0]||'').slice(0,2).join('');
  document.getElementById('dp-body').innerHTML = `
    <div><div class="dp-label">Зөвлөх</div>
      <div class="dp-owner-row">
        <div class="dp-av" style="background:${oc}">${ini}</div>
        <div class="dp-val" style="color:${oc};font-weight:600">${t.owner||'—'}</div>
      </div>
    </div>
    <div><div class="dp-label">Ангилал</div><div class="dp-val">${t.cat||'—'}</div></div>
    <div><div class="dp-label">Огноо</div><div class="dp-val">${t.start||'—'} → ${t.due||'—'}</div></div>
    <div><div class="dp-label">Төлөв</div>
      <div class="dp-stat" style="background:${statBg};color:${statColor}">${statTxt}</div>
    </div>
    <div><div class="dp-label">Гүйцэтгэл — ${t.prog}%</div>
      <div class="dp-track"><div class="dp-fill" style="width:${t.prog}%;background:${progCol}"></div></div>
    </div>
    ${t.note?`<div><div class="dp-label">Тайлбар</div><div class="dp-note">${t.note}</div></div>`:''}
  `;
  document.getElementById('detail-panel').classList.add('open');
}

document.getElementById('cal-body').addEventListener('click', function(e) {
  const evt = e.target.closest('.evt');
  if (evt && evt.dataset.id) showDetail(evt.dataset.id);
});
function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

function calcDayHeight() {
  const used = ['topbar','toolbar','month-stats-bar'].reduce((s,id)=>{
    const el=document.querySelector('.'+id)||document.getElementById(id);
    return s+(el?el.offsetHeight:0);
  },0) + (document.querySelector('.cal-table thead')?.offsetHeight||34) + 24;
  const rows = document.querySelectorAll('#cal-body tr').length||6;
  const h = Math.max(60, Math.floor((window.innerHeight-used)/rows));
  document.documentElement.style.setProperty('--day-h', h+'px');
}

window.addEventListener('resize', calcDayHeight);
renderMonth('2026-08');
</script>
